name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/check_repository.py
      - name: Scan Git history and working tree for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
          "$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner --max-target-megabytes 2 src config deploy .github
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/tipnews-requirements.txt
          uv run --locked pip-audit -r /tmp/tipnews-requirements.txt --disable-pip --no-deps
      - name: Test actual migrations
        run: |
          uv run --locked tipnews migrate
          uv run --locked tipnews migrate
          uv run --locked alembic check
  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and smoke-test runtime
        run: |
          docker build --pull -t tipnews:test .
          docker run --rm --network none --read-only tipnews:test check
          test "$(docker image inspect --format '{{.Config.User}}' tipnews:test)" = '10001:10001'
          docker run --rm --network none --entrypoint python tipnews:test -c "from pathlib import Path; p=Path('/app'); assert not list(p.rglob('.env*')); assert not (p/'.git').exists(); assert not (p/'secrets').exists()"
      - name: Validate production Compose
        env:
          TIPNEWS_IMAGE: tipnews:test
          TIPNEWS_MODEL_IMAGE: ollama/ollama:test
          TIPNEWS_TOKEN_PATH: /tmp/absent-tipnews-token
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Publish immutable revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          docker tag tipnews:test "$image"
          docker push "$image"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
