# Standalone Gemini profile. Use the same project name/data volume as compose.yml.
name: tipnews
services:
  app:
    image: ${TIPNEWS_IMAGE:?Set an immutable GHCR image digest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 96
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      TIPNEWS_TOKEN_FILE: /run/secrets/telegram_token
      TIPNEWS_DATABASE_URL: sqlite+aiosqlite:////app/data/tipnews.db
      TIPNEWS_LLM_PROVIDER: gemini
      TIPNEWS_GEMINI_API_KEY: ${TIPNEWS_GEMINI_API_KEY:-}
      TIPNEWS_GEMINI_MODEL: ${TIPNEWS_GEMINI_MODEL:-gemini-2.5-flash}
      TIPNEWS_GEMINI_MAX_OUTPUT_TOKENS: ${TIPNEWS_GEMINI_MAX_OUTPUT_TOKENS:-512}
      TIPNEWS_GEMINI_DAILY_REQUEST_LIMIT: ${TIPNEWS_GEMINI_DAILY_REQUEST_LIMIT:-100}
      TIPNEWS_GEMINI_TIMEOUT_SECONDS: ${TIPNEWS_GEMINI_TIMEOUT_SECONDS:-45}
      TIPNEWS_TIMEZONE: Europe/Moscow
      TIPNEWS_DIGEST_TIME: "07:15"
      TIPNEWS_WEATHER_REFRESH_TIME: "07:10"
      TIPNEWS_ADMIN_IDS: ${TIPNEWS_ADMIN_IDS:-}
    secrets: [telegram_token]
    volumes: [app_data:/app/data]
    networks: [outbound]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  outbound: {}
volumes:
  app_data: {}
secrets:
  telegram_token:
    file: ${TIPNEWS_TOKEN_PATH:?Set the absolute server secret file path}
