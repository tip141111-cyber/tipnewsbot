[project]
name = "tipnews"
version = "0.1.0"
description = "Resource-conscious Telegram news digests"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.20,<4", "httpx>=0.28,<0.29", "feedparser>=6,<7",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.21,<1", "alembic>=1.15,<2", "tzdata>=2025.1", "filelock>=3.18,<4",
  "defusedxml>=0.7,<1",
]

[project.scripts]
tipnews = "tipnews.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/tipnews"]
