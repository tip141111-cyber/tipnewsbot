repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: gitleaks
        name: Staged secret scan
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
